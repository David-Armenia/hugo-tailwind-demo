<!doctype html>
<html lang="ru" class="">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="Hugo + Tailwind демо: компоненты, SEO, schema.org."/>
  <meta name="theme-color" content="#111827"/>

  <!-- Canonical -->
  <link rel="canonical" href="{{ .Permalink }}"/>

  <!-- OpenGraph -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="{{ .Site.Title }}"/>
  <meta property="og:title" content="{{ .Title }}"/>
  <meta property="og:description" content="Демо-проект Hugo + Tailwind."/>
  <meta property="og:image" content="{{ "images/og.png" | relURL }}"/>
  <link rel="icon" type="image/png" href="{{ "favicon-32.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "icons/icon-512.png" | relURL }}">


  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"Demo Studio",
    "url":"{{ .Site.BaseURL }}",
    "sameAs":["https://github.com/"]
  }
  </script>

  {{ $css := resources.Get "css/input.css" | postCSS | minify }}
  <link href="{{ $css.RelPermalink }}" rel="stylesheet"/>

  <script>
    // persist dark mode
    (function(){
      const root = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
      }
      window.__toggleTheme = function(){
        root.classList.toggle('dark');
        localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
      }
    })();
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  {{ partial "header.html" . }}

  <main class="container py-10">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
